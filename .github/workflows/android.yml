name: Build CATV MANAGER v2.4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Extract CATV MANAGER source ZIP
      - name: Extract source
        run: |
          unzip -q CATV_MANAGER_Android_v2.4.zip -d source

      # 5. Verify Android project
      - name: Verify project
        run: |
          test -f source/GajananCableManager/app/build.gradle
          test -f source/GajananCableManager/app/src/main/AndroidManifest.xml

      # 6. Build APK
      - name: Build Debug APK
        working-directory: source/GajananCableManager
        run: |
          gradle --no-daemon clean assembleDebug

      # 7. Upload APK
      - name: Upload CATV MANAGER APK
        uses: actions/upload-artifact@v4
        with:
          name: CATV-MANAGER-v2.4-APK
          path: source/GajananCableManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
