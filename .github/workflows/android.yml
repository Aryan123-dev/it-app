name: Build Gajanan Cable Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GajananCableManager_Android_v2.2.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify ZIP
        run: |
          ls -lh
          test -f GajananCableManager_Android_v2.2.zip

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q GajananCableManager_Android_v2.2.zip -d source

      - name: Verify project
        run: |
          test -f source/GajananCableManager/app/build.gradle
          test -f source/GajananCableManager/settings.gradle

      - name: Build APK
        working-directory: source/GajananCableManager
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GajananCableManager-APK-v2.2
          path: source/GajananCableManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
