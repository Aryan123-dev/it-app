name: Build Gajanan Cable Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GajananCableManager_Android_v1.3.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify ZIP exists
        run: |
          ls -la
          test -f GajananCableManager_Android_v1.3.zip

      - name: Extract Android project
        run: |
          mkdir source
          unzip -q GajananCableManager_Android_v1.3.zip -d source

      - name: Verify Gradle project
        run: |
          ls -la source/GajananCableManager
          test -f source/GajananCableManager/app/build.gradle

      - name: Build debug APK
        working-directory: source/GajananCableManager
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GajananCableManager-APK
          path: source/GajananCableManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
